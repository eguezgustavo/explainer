<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__EXPLAIN_TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
<!-- Material UI 5 is the last MUI major that ships a single-file browser build. Versions are pinned. -->
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mui/material@5.18.0/umd/material-ui.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<style>
  body { margin: 0; }
  #boot { font: 16px/1.5 system-ui, sans-serif; padding: 2rem 1rem; max-width: 40rem; margin: 0 auto; }
</style>
</head>
<body>
<div id="root"><p id="boot">Loading…</p></div>

<script id="explain-data" type="application/json">__EXPLAIN_DATA__</script>
<script>
(function () {
  'use strict';

  var boot = document.getElementById('boot');
  if (!window.React || !window.ReactDOM || !window.MaterialUI || !window.htm) {
    boot.textContent = 'This page could not load Material UI. It needs the network once, to load React and MUI. Connect and reload.';
    return;
  }

  var React = window.React, M = window.MaterialUI;
  var html = window.htm.bind(React.createElement);
  var useState = React.useState, useEffect = React.useEffect, useRef = React.useRef, useMemo = React.useMemo, useCallback = React.useCallback;
  var Alert = M.Alert, Box = M.Box, Button = M.Button, Card = M.Card, CardContent = M.CardContent, Checkbox = M.Checkbox,
    Chip = M.Chip, Container = M.Container, CssBaseline = M.CssBaseline, FormControlLabel = M.FormControlLabel,
    Stack = M.Stack, Tab = M.Tab, Table = M.Table, TableBody = M.TableBody, TableCell = M.TableCell, TableHead = M.TableHead,
    TableRow = M.TableRow, Tabs = M.Tabs, TextField = M.TextField, ThemeProvider = M.ThemeProvider, Typography = M.Typography;

  var DATA = JSON.parse(document.getElementById('explain-data').textContent);
  var ORDER = ['L0', 'L1', 'L2', 'L3', 'L4', 'L5', 'L6'];
  var DEFAULTS = {
    L0: { title: 'Purpose', question: 'Why does this exist?', predict: 'In one sentence, what do you think this app is for?', check: 'Explain it to a non-engineer in about 10 seconds.' },
    L1: { title: 'Actors', question: 'Who uses it, and what outside systems does it touch?', predict: 'List who you think uses it and what each is trying to do, plus any outside systems.', check: 'Name every actor and its goal.' },
    L2: { title: 'Blocks', question: 'What are the big parts?', predict: 'Sketch the big parts and which one depends on which.', check: 'Draw the blocks and their dependencies.' },
    L3: { title: 'Journey', question: 'How does one action cross the blocks?', predict: 'Walk the example action through the parts, in order.', check: 'Narrate one scenario, block by block.' },
    L4: { title: 'Inside a block', question: 'What rules, entities and states live here?', predict: 'List the rules and the stages a main record goes through.', check: 'List the rules and the lifecycle.' },
    L5: { title: 'Code', question: 'Which files and functions do this?', predict: 'Which files do you expect the action to touch, in call order?', check: 'Predict the files, then check.' },
    L6: { title: 'Edges', question: 'What breaks, and why is it built this way?', predict: 'What happens if one step fails? What else could the design have been?', check: 'State one failure and one alternative that was rejected.' }
  };

  var app = DATA.app || {};
  var byId = {};
  (DATA.levels || []).forEach(function (l) { byId[l.id] = l; });
  document.title = (app.name || 'App') + ' · explained';

  // ---------- saved progress (same shape and key as before, browser only) ----------
  var KEY = 'explain:' + (app.name || 'app') + ':' + (app.path || '');
  function loadState() {
    var state = { current: null, passed: {}, revealed: {}, predictions: {}, explanations: {}, ticks: {}, pointsShown: {}, openAnyway: {} };
    try {
      var raw = window.localStorage.getItem(KEY);
      if (raw) { var saved = JSON.parse(raw); Object.keys(state).forEach(function (k) { if (saved[k] !== undefined) state[k] = saved[k]; }); }
    } catch (e) { /* storage unavailable: run without saving */ }
    var first = ORDER.filter(function (id) { return byId[id]; })[0];
    if (!state.current || !byId[state.current]) state.current = first;
    return state;
  }

  function levelNum(id) { return ORDER.indexOf(id); }
  function prevPresent(id) {
    var i = levelNum(id) - 1;
    while (i >= 0 && !byId[ORDER[i]]) i--;
    return i >= 0 ? ORDER[i] : null;
  }
  function nextPresent(id) {
    for (var i = levelNum(id) + 1; i < ORDER.length; i++) if (byId[ORDER[i]]) return ORDER[i];
    return null;
  }
  function isUnlocked(state, id) {
    var p = prevPresent(id);
    return !p || !!state.passed[p] || !!state.openAnyway[id];
  }
  function meta(id, field) { return (byId[id] || {})[field] || DEFAULTS[id][field]; }

  // ---------- diagrams: Mermaid inside a Material UI box, with a readable fallback ----------
  var seq = 0;
  function clean(s) { return String(s).replace(/[;#]/g, ',').replace(/[\r\n]+/g, ' '); }
  function buildSequence(steps, n) {
    var alias = new Map();
    for (var i = 0; i < n; i++) {
      [steps[i].from, steps[i].to].forEach(function (name) { if (!alias.has(name)) alias.set(name, 'p' + alias.size); });
    }
    var lines = ['sequenceDiagram'];
    alias.forEach(function (a, name) { lines.push('  participant ' + a + ' as ' + clean(name)); });
    for (var j = 0; j < n; j++) lines.push('  ' + alias.get(steps[j].from) + '->>' + alias.get(steps[j].to) + ': ' + clean(steps[j].text));
    return lines.join('\n');
  }

  function Diagram(props) {
    var ref = useRef(null);
    var dark = M.useTheme().palette.mode === 'dark';
    var failed = useState(null);
    var setFailed = failed[1];
    useEffect(function () {
      var cancelled = false;
      var el = ref.current;
      setFailed(null);
      if (!window.mermaid) { setFailed('The diagram library could not load (it needs the network once). Diagram source:'); return; }
      window.mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: dark ? 'dark' : 'default' });
      var id = 'mmd' + (++seq);
      window.mermaid.render(id, props.source).then(function (r) {
        if (!cancelled && el) el.innerHTML = r.svg;
      }).catch(function () {
        var leftover = document.getElementById('d' + id);
        if (leftover) leftover.remove();
        if (!cancelled) { if (el) el.textContent = ''; setFailed('This diagram failed to render. Diagram source:'); }
      });
      return function () { cancelled = true; };
    }, [props.source, dark]);
    return html`<${Box} data-testid="diagram" sx=${{ my: 1, overflowX: 'auto' }}>
      ${failed[0] ? html`<div data-testid="diagram-fallback">
        <${Typography} variant="caption" color="text.secondary">${failed[0]}<//>
        <${Box} component="pre" sx=${{ bgcolor: 'action.hover', p: 1.5, borderRadius: 1, overflowX: 'auto', fontSize: 12, m: 0.5 }}>${props.source}<//>
      </div>` : null}
      <${Box} ref=${ref} sx=${{ display: 'flex', justifyContent: 'center', '& svg': { maxWidth: '100%', height: 'auto' } }} />
    <//>`;
  }

  function Journey(props) {
    var steps = props.journey.steps || [];
    var nState = useState(1);
    var n = nState[0], setN = nState[1];
    var source = useMemo(function () { return steps.length ? buildSequence(steps, n) : ''; }, [steps, n]);
    if (!steps.length) return null;
    return html`<div>
      <${Typography} variant="subtitle1" sx=${{ fontWeight: 500, mt: 1 }}>${props.journey.title || 'Step through the journey'}<//>
      <${Diagram} source=${source} />
      <${Typography} align="center" data-testid="caption" sx=${{ minHeight: '1.6em', mb: 1 }}>${steps[n - 1].text}<//>
      <${Stack} direction="row" spacing=${2} sx=${{ justifyContent: 'center', alignItems: 'center' }}>
        <${Button} variant="outlined" disabled=${n === 1} onClick=${function () { setN(n - 1); }}>◀ Back<//>
        <${Typography} variant="body2" color="text.secondary" data-testid="counter" sx=${{ minWidth: '4rem', textAlign: 'center' }}>${n + ' / ' + steps.length}<//>
        <${Button} variant="outlined" disabled=${n === steps.length} onClick=${function () { setN(n + 1); }}>Next ▶<//>
      <//>
    </div>`;
  }

  // ---------- small building blocks ----------
  function Label(props) {
    return html`<${Typography} variant="overline" component="h3" color="text.secondary" sx=${{ display: 'block', lineHeight: 1.8 }}>${props.children}<//>`;
  }
  function Code(props) {
    return html`<${Box} component="code" sx=${{ bgcolor: 'action.hover', px: 0.6, py: 0.1, borderRadius: 0.5, fontSize: '0.85em', fontFamily: 'ui-monospace, Menlo, monospace' }}>${props.children}<//>`;
  }

  function EvidenceList(props) {
    return html`<${Stack} spacing=${1}>
      ${(props.lv.evidence || []).map(function (e, i) {
        var ok = e.status === 'verified';
        return html`<${Stack} key=${i} direction="row" spacing=${1} sx=${{ alignItems: 'baseline', flexWrap: 'wrap', rowGap: 0.5 }}>
          <${Chip} size="small" color=${ok ? 'success' : 'warning'} variant="outlined" label=${ok ? 'verified' + (e.how ? ' · ' + e.how : '') : 'unverified'} />
          <${Typography} variant="body2">${e.claim}<//>
          ${e.where ? html`<${Code}>${e.where}<//>` : null}
        <//>`;
      })}
    <//>`;
  }

  function MetaphorPanel(props) {
    var m = props.metaphor;
    return html`<div>
      <${Typography}>${m.text}<//>
      ${(m.mapping || []).length ? html`<${Table} size="small">
        <${TableHead}><${TableRow}><${TableCell}>In the metaphor<//><${TableCell}>In this app<//><//><//>
        <${TableBody}>${m.mapping.map(function (r, i) { return html`<${TableRow} key=${i}><${TableCell}>${r[0]}<//><${TableCell}>${r[1]}<//><//>`; })}<//>
      <//>` : null}
    </div>`;
  }

  function TermsPanel(props) {
    return html`<${Table} size="small">
      <${TableHead}><${TableRow}><${TableCell}>Plain words<//><${TableCell}>Architecture term<//><${TableCell}>Name in the code<//><//><//>
      <${TableBody}>${props.rows.map(function (g, i) {
        return html`<${TableRow} key=${i}><${TableCell}>${g.plain || ''}<//><${TableCell}>${g.term || ''}<//><${TableCell}>${g.code ? html`<${Code}>${g.code}<//>` : ''}<//><//>`;
      })}<//>
    <//>`;
  }

  // ---------- optional detail: small chips, one panel open at a time ----------
  function MoreCard(props) {
    var id = props.id, lv = props.lv, a = props.answer;
    var openState = useState(null);
    var open = openState[0], setOpen = openState[1];
    var points = a.points || [], evidence = lv.evidence || [], unverified = lv.unverified || [];
    var terms = (DATA.glossary || []).filter(function (g) { return g.level <= levelNum(id); });
    var items = [];
    if (a.example) items.push({ key: 'example', label: 'Example', build: function () {
      return html`<${Box} data-testid="example" sx=${{ bgcolor: 'action.hover', borderRadius: 1, p: 1.5 }}><${Label}>Concrete example<//><${Typography}>${a.example}<//><//>`; } });
    if (points.length) items.push({ key: 'more', label: 'More detail', count: points.length, build: function () {
      return html`<${Box} component="ul" data-testid="points" sx=${{ m: 0, pl: 3 }}>${points.map(function (p, i) { return html`<li key=${i}><${Typography} variant="body2" sx=${{ my: 0.5 }}>${p}<//></li>`; })}<//>`; } });
    if (evidence.length) items.push({ key: 'evidence', label: 'Where this comes from', count: evidence.length, build: function () { return html`<div data-testid="evidence"><${EvidenceList} lv=${lv} /></div>`; } });
    if (unverified.length) items.push({ key: 'unverified', label: 'Not confirmed', count: unverified.length, warn: true, build: function () {
      return html`<${Alert} severity="warning" data-testid="unverified"><${Box} component="ul" sx=${{ m: 0, pl: 2 }}>${unverified.map(function (u, i) { return html`<li key=${i}>${u}</li>`; })}<//><//>`; } });
    if (lv.metaphor && lv.metaphor.text) items.push({ key: 'metaphor', label: 'Metaphor', build: function () { return html`<${MetaphorPanel} metaphor=${lv.metaphor} />`; } });
    if (terms.length) items.push({ key: 'terms', label: 'Terms so far', count: terms.length, build: function () { return html`<${TermsPanel} rows=${terms} />`; } });
    if (!items.length) return null;
    var chosen = items.filter(function (it) { return it.key === open; })[0];
    return html`<${Card} variant="outlined" sx=${{ mb: 2 }}><${CardContent}>
      <${Label}>Want more? Open one at a time<//>
      <${Stack} direction="row" spacing=${1} sx=${{ flexWrap: 'wrap', rowGap: 1 }}>
        ${items.map(function (it) {
          return html`<${Chip} key=${it.key} clickable aria-pressed=${open === it.key ? 'true' : 'false'}
            color=${it.warn ? 'warning' : (open === it.key ? 'primary' : 'default')} variant=${open === it.key ? 'filled' : 'outlined'}
            label=${it.label + (it.count ? ' (' + it.count + ')' : '')}
            onClick=${function () { setOpen(open === it.key ? null : it.key); }} />`;
        })}
      <//>
      ${chosen ? html`<${Box} data-testid="panel" sx=${{ mt: 2 }}>${chosen.build()}<//>` : null}
    <//><//>`;
  }

  // ---------- the pass check ----------
  function CheckCard(props) {
    var id = props.id, lv = props.lv, state = props.state, update = props.update;
    var chk = lv.check || {};
    var points = chk.goodAnswerIncludes || [];
    var ticks = state.ticks[id] || [];
    var written = (state.explanations[id] || '').trim().length > 0;
    var all = points.every(function (_, i) { return !!ticks[i]; });
    var ready = written && (points.length === 0 || all);
    var passed = !!state.passed[id];
    var shown = !!state.pointsShown[id];
    var nxt = nextPresent(id);
    return html`<${Card} variant="outlined" sx=${{ mb: 2 }}><${CardContent}>
      <${Label}>Check: can you say it without looking?<//>
      <${Typography} sx=${{ mb: 1.5 }}>${chk.prompt || DEFAULTS[id].check}<//>
      <${TextField} multiline minRows=${4} fullWidth placeholder="Say it in your own words, without looking at the answer above…"
        value=${state.explanations[id] || ''}
        onChange=${function (e) { var v = e.target.value; update(function (s) { s.explanations[id] = v; }); }} />
      <${Stack} direction="row" spacing=${1.5} sx=${{ mt: 1.5, alignItems: 'center', flexWrap: 'wrap', rowGap: 1 }}>
        <${Button} variant="outlined" onClick=${function () { update(function (s) { s.pointsShown[id] = !s.pointsShown[id]; }); }}>${shown ? 'Hide the checklist' : 'Check my answer'}<//>
      <//>
      ${shown && points.length ? html`<${Box} data-testid="checklist" sx=${{ mt: 1 }}>
        ${points.map(function (p, i) {
          return html`<${FormControlLabel} key=${i} sx=${{ display: 'flex', alignItems: 'flex-start', mr: 0 }}
            control=${html`<${Checkbox} size="small" checked=${!!ticks[i]} onChange=${function (e) { var c = e.target.checked; update(function (s) { var t = s.ticks[id] || (s.ticks[id] = []); t[i] = c; }); }} />`}
            label=${html`<${Typography} variant="body2" sx=${{ pt: 0.6 }}>${p}<//>`} />`;
        })}
      <//>` : null}
      <${Stack} direction="row" spacing=${1.5} sx=${{ mt: 1.5, alignItems: 'center', flexWrap: 'wrap', rowGap: 1 }}>
        ${passed ? html`<${React.Fragment}>
          <${Typography} sx=${{ color: 'success.main', fontWeight: 500 }}>${'✓ ' + id + ' passed'}<//>
          ${nxt ? html`<${Button} variant="contained" onClick=${function () { props.go(nxt); }}>${'Next: ' + nxt + ' ' + meta(nxt, 'title') + ' →'}<//>` : null}
          <${Button} variant="outlined" onClick=${function () { update(function (s) { delete s.passed[id]; }); }}>Undo<//>
        <//>`
        : html`<${React.Fragment}>
          <${Button} variant="contained" disabled=${!ready} onClick=${function () { update(function (s) { s.passed[id] = true; }); }}>${'Mark ' + id + ' passed'}<//>
          <${Typography} variant="body2" color="text.secondary">${!written ? 'Write your explanation first.' : (!all ? 'Tick each point your explanation covered.' : '')}<//>
        <//>`}
      <//>
    <//><//>`;
  }

  // ---------- one level ----------
  function LevelView(props) {
    var id = props.id, state = props.state, update = props.update, go = props.go;
    var lv = byId[id];
    var head = html`<div>
      <${Typography} variant="h5" component="h2" sx=${{ mt: 1 }}>${id + ' · ' + meta(id, 'title')}
        ${lv.scope ? html`<${Typography} component="span" variant="caption" color="text.secondary" sx=${{ ml: 1 }}>${lv.scope}<//>` : null}<//>
      <${Typography} variant="subtitle1" sx=${{ mb: 2 }}>${meta(id, 'question')}<//>
    </div>`;

    if (!isUnlocked(state, id)) {
      var p = prevPresent(id);
      return html`<div>${head}
        <${Alert} severity="warning" sx=${{ mb: 2 }}>
          ${id + ' is locked until you pass the ' + p + ' check. Going down before the level above makes sense is the most common way to get lost.'}
          <${Stack} direction="row" spacing=${1} sx=${{ mt: 1.5 }}>
            <${Button} variant="contained" onClick=${function () { go(p); }}>${'Go to ' + p}<//>
            <${Button} variant="outlined" onClick=${function () { update(function (s) { s.openAnyway[id] = true; }); }}>${'Open ' + id + ' anyway'}<//>
          <//>
        <//>
      </div>`;
    }

    if (!state.revealed[id]) {
      return html`<div>${head}
        <${Card} variant="outlined" sx=${{ mb: 2 }}><${CardContent}>
          <${Label}>Predict first<//>
          <${Typography} sx=${{ mb: 1.5 }}>${(lv.predict && lv.predict.prompt) || DEFAULTS[id].predict}<//>
          <${TextField} multiline minRows=${3} fullWidth placeholder="Your best guess. Being wrong is useful: the gap is the lesson."
            value=${state.predictions[id] || ''}
            onChange=${function (e) { var v = e.target.value; update(function (s) { s.predictions[id] = v; }); }} />
          <${Stack} direction="row" spacing=${1.5} sx=${{ mt: 1.5, alignItems: 'center', flexWrap: 'wrap', rowGap: 1 }}>
            <${Button} variant="contained" onClick=${function () { update(function (s) { s.revealed[id] = true; }); }}>Reveal the verified answer<//>
            <${Typography} variant="body2" color="text.secondary">Skipping the guess works, but you learn less.<//>
          <//>
        <//><//>
      </div>`;
    }

    // Revealed: one small paragraph and a visual. Everything else is opt-in.
    var a = lv.answer || {};
    var guess = (state.predictions[id] || '').trim();
    return html`<div>${head}
      <${Card} variant="outlined" sx=${{ mb: 2 }}><${CardContent}>
        <${Label}>Verified answer<//>
        ${guess ? html`<${Box} data-testid="compare" sx=${{ display: 'grid', gridTemplateColumns: { xs: '1fr', sm: '1fr 1fr' }, gap: 1.5, mb: 1.5 }}>
          <${Box} sx=${{ bgcolor: 'action.hover', borderRadius: 1, p: 1.5, whiteSpace: 'pre-wrap' }}><${Label}>Your prediction<//>${guess}<//>
          <${Box} sx=${{ bgcolor: 'action.hover', borderRadius: 1, p: 1.5 }}><${Label}>Verified<//>${a.summary || ''}<//>
        <//>` : html`<${Typography} variant="h6" data-testid="summary" sx=${{ fontWeight: 400, mb: 1 }}>${a.summary || ''}<//>`}
        ${a.diagram && a.diagram.source ? html`<div>
          ${a.diagram.title ? html`<${Typography} variant="subtitle1" sx=${{ fontWeight: 500, mt: 1 }}>${a.diagram.title}<//>` : null}
          <${Diagram} source=${a.diagram.source} />
        </div>` : null}
        ${a.journey ? html`<${Journey} journey=${a.journey} />` : null}
      <//><//>
      <${MoreCard} id=${id} lv=${lv} answer=${a} />
      <${CheckCard} id=${id} lv=${lv} state=${state} update=${update} go=${go} />
    </div>`;
  }

  // ---------- the page ----------
  function App() {
    var prefersDark = M.useMediaQuery('(prefers-color-scheme: dark)');
    var theme = useMemo(function () {
      return M.createTheme({ palette: { mode: prefersDark ? 'dark' : 'light' }, shape: { borderRadius: 12 }, typography: { button: { textTransform: 'none' } } });
    }, [prefersDark]);
    var st = useState(loadState);
    var state = st[0], setState = st[1];
    var update = useCallback(function (fn) {
      setState(function (prev) {
        var next = JSON.parse(JSON.stringify(prev));
        fn(next);
        try { window.localStorage.setItem(KEY, JSON.stringify(next)); } catch (e) { /* ignore */ }
        return next;
      });
    }, []);
    var go = useCallback(function (id) { update(function (s) { s.current = id; }); window.scrollTo(0, 0); }, [update]);

    var bits = [app.path, app.commit ? 'commit ' + app.commit : null, app.generatedAt ? 'generated ' + app.generatedAt : null].filter(Boolean);
    return html`<${ThemeProvider} theme=${theme}><${CssBaseline} />
      <${Container} maxWidth="md" sx=${{ py: 3 }}>
        <header>
          <${Typography} variant="h5" component="h1" sx=${{ fontWeight: 500 }}>${(app.name || 'App') + ', explained'}<//>
          <${Typography} variant="caption" color="text.secondary" component="p" sx=${{ m: 0 }}>${bits.join(' · ')}<//>
          ${(DATA.verification || {}).method ? html`<${Typography} variant="caption" color="text.secondary" component="p" sx=${{ m: 0 }}>${'How it was checked: ' + DATA.verification.method}<//>` : null}
          ${DATA.scenario ? html`<${Alert} severity="info" icon=${false} sx=${{ mt: 1.5 }}>${'Running example: ' + DATA.scenario}<//>` : null}
        </header>
        <${Tabs} value=${state.current} variant="scrollable" scrollButtons="auto" allowScrollButtonsMobile
          onChange=${function (_, v) { go(v); }} sx=${{ mt: 2, mb: 1, borderBottom: 1, borderColor: 'divider' }}>
          ${ORDER.map(function (id) {
            var lv = byId[id];
            var label = id + ' ' + (lv ? meta(id, 'title') : DEFAULTS[id].title) + (lv && state.passed[id] ? ' ✓' : '') + (lv && !isUnlocked(state, id) ? ' 🔒' : '');
            return html`<${Tab} key=${id} value=${id} label=${label} disabled=${!lv}
              sx=${{ color: lv && state.passed[id] && id !== state.current ? 'success.main' : undefined, opacity: lv && !isUnlocked(state, id) && id !== state.current ? 0.6 : undefined }} />`;
          })}
        <//>
        <${LevelView} key=${state.current} id=${state.current} state=${state} update=${update} go=${go} />
        <${Stack} direction="row" sx=${{ mt: 3, justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap' }}>
          <${Typography} variant="caption" color="text.secondary">Your notes and progress stay in this browser only.<//>
          <${Button} size="small" color="inherit" onClick=${function () {
            if (!window.confirm('Clear your predictions, explanations and progress on this page?')) return;
            try { window.localStorage.removeItem(KEY); } catch (e) { /* ignore */ }
