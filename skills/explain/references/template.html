<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__EXPLAIN_TITLE__</title>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --card: #ffffff; --line: #e7e5e4;
    --accent: #1d4ed8; --accent-fg: #ffffff; --ok: #15803d; --ok-bg: #dcfce7;
    --warn: #b45309; --warn-bg: #fef3c7; --code-bg: #f5f5f4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16130f; --fg: #e7e5e4; --muted: #a8a29e; --card: #201c18; --line: #3a342f;
      --accent: #60a5fa; --accent-fg: #0b1220; --ok: #4ade80; --ok-bg: #14301f;
      --warn: #fbbf24; --warn-bg: #3a2a0a; --code-bg: #2a2521;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); line-height: 1.55;
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
  header h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
  .meta { color: var(--muted); font-size: .85rem; margin: 0; }
  .scenario { margin: .75rem 0 0; padding: .6rem .8rem; border-left: 3px solid var(--accent); background: var(--card); border-radius: 0 8px 8px 0; font-size: .95rem; }
  nav#tabs { display: flex; gap: .4rem; overflow-x: auto; padding: 1rem 0 .5rem; }
  .tab { flex: 0 0 auto; font: inherit; font-size: .85rem; padding: .4rem .8rem; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; white-space: nowrap; }
  .tab.active { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .tab.passed:not(.active) { border-color: var(--ok); color: var(--ok); }
  .tab.locked:not(.active) { opacity: .55; }
  .tab:disabled { opacity: .3; cursor: default; }
  h2 { font-size: 1.25rem; margin: .5rem 0 .25rem; }
  h2 small { color: var(--muted); font-weight: 400; font-size: .8rem; margin-left: .5rem; }
  h3 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 .5rem; }
  h4 { margin: .75rem 0 .35rem; font-size: 1rem; }
  .question { font-size: 1.05rem; margin: 0 0 1rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 1rem 1.1rem; margin: 0 0 1rem; }
  textarea { width: 100%; font: inherit; font-size: .95rem; padding: .6rem .7rem; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); resize: vertical; }
  .btn { font: inherit; font-size: .9rem; padding: .45rem .95rem; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
  .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .btn:disabled { opacity: .4; cursor: default; }
  .row { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; margin-top: .6rem; }
  .hint { color: var(--muted); font-size: .85rem; }
  .summary { font-size: 1.05rem; margin: 0 0 .75rem; }
  .example { background: var(--code-bg); border-radius: 8px; padding: .6rem .8rem; margin: 0 0 .75rem; font-size: .95rem; }
  .example b { display: block; font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: .15rem; }
  ul.points { margin: .25rem 0 .5rem 1.1rem; padding: 0; }
  ul.points li { margin: .2rem 0; }
  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; margin: 0 0 .75rem; }
  .compare > div { background: var(--code-bg); border-radius: 8px; padding: .6rem .8rem; font-size: .92rem; white-space: pre-wrap; }
  .compare b { display: block; font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: .15rem; }
  @media (max-width: 600px) { .compare { grid-template-columns: 1fr; } }
  .diagram { display: flex; justify-content: center; overflow-x: auto; margin: .5rem 0; }
  .diagram svg { max-width: 100%; height: auto; }
  .diagram pre, .fallback pre { background: var(--code-bg); padding: .6rem .8rem; border-radius: 8px; overflow-x: auto; font-size: .8rem; }
  .caption { text-align: center; margin: .25rem 0; min-height: 1.5em; }
  .controls { display: flex; gap: .8rem; justify-content: center; align-items: center; }
  .counter { color: var(--muted); font-size: .85rem; min-width: 4rem; text-align: center; }
  ul.evidence { list-style: none; margin: 0; padding: 0; }
  ul.evidence li { display: flex; gap: .5rem; align-items: baseline; margin: .35rem 0; font-size: .9rem; flex-wrap: wrap; }
  .badge { font-size: .7rem; padding: .1rem .5rem; border-radius: 999px; font-weight: 600; white-space: nowrap; }
  .badge.verified { background: var(--ok-bg); color: var(--ok); }
  .badge.unverified { background: var(--warn-bg); color: var(--warn); }
  code { background: var(--code-bg); padding: .05rem .35rem; border-radius: 4px; font-size: .85em; }
  .unverified-box { background: var(--warn-bg); color: var(--fg); border-left: 3px solid var(--warn); border-radius: 0 8px 8px 0; padding: .6rem .8rem; margin-top: .75rem; font-size: .9rem; }
  .unverified-box b { color: var(--warn); }
  .banner { background: var(--warn-bg); border-left: 3px solid var(--warn); border-radius: 0 8px 8px 0; padding: .7rem .9rem; margin: 0 0 1rem; }
  details.metaphor { margin: .75rem 0 0; }
  details.metaphor summary { cursor: pointer; color: var(--muted); font-size: .9rem; }
  table { border-collapse: collapse; width: 100%; font-size: .88rem; margin-top: .4rem; }
  th, td { text-align: left; padding: .3rem .5rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; }
  label.tick { display: flex; gap: .5rem; align-items: flex-start; margin: .35rem 0; font-size: .92rem; cursor: pointer; }
  .passed-note { color: var(--ok); font-weight: 600; }
  footer { margin-top: 2rem; display: flex; justify-content: space-between; color: var(--muted); font-size: .8rem; flex-wrap: wrap; gap: .5rem; }
  footer button { background: none; border: none; color: var(--muted); text-decoration: underline; cursor: pointer; font: inherit; }
</style>
</head>
<body>
<div class="wrap">
  <header id="head"></header>
  <nav id="tabs" aria-label="Levels"></nav>
  <main id="view"></main>
  <footer id="foot"></footer>
</div>

<script id="explain-data" type="application/json">__EXPLAIN_DATA__</script>
<script>
(function () {
  'use strict';

  var DATA = JSON.parse(document.getElementById('explain-data').textContent);
  var ORDER = ['L0', 'L1', 'L2', 'L3', 'L4', 'L5', 'L6'];
  var DEFAULTS = {
    L0: { title: 'Purpose', question: 'Why does this exist?', predict: 'In one sentence, what do you think this app is for?', check: 'Explain it to a non-engineer in about 10 seconds.' },
    L1: { title: 'Actors', question: 'Who uses it, and what outside systems does it touch?', predict: 'List who you think uses it and what each is trying to do, plus any outside systems.', check: 'Name every actor and its goal.' },
    L2: { title: 'Blocks', question: 'What are the big parts?', predict: 'Sketch the big parts and which one depends on which.', check: 'Draw the blocks and their dependencies.' },
    L3: { title: 'Journey', question: 'How does one action cross the blocks?', predict: 'Walk the example action through the parts, in order.', check: 'Narrate one scenario, block by block.' },
    L4: { title: 'Inside a block', question: 'What rules, entities and states live here?', predict: 'List the rules and the stages a main record goes through.', check: 'List the rules and the lifecycle.' },
    L5: { title: 'Code', question: 'Which files and functions do this?', predict: 'Which files do you expect the action to touch, in call order?', check: 'Predict the files, then check.' },
    L6: { title: 'Edges', question: 'What breaks, and why is it built this way?', predict: 'What happens if one step fails? What else could the design have been?', check: 'State one failure and one alternative that was rejected.' }
  };

  var app = DATA.app || {};
  var byId = {};
  (DATA.levels || []).forEach(function (l) { byId[l.id] = l; });

  var KEY = 'explain:' + (app.name || 'app') + ':' + (app.path || '');
  var state = { current: null, passed: {}, revealed: {}, predictions: {}, explanations: {}, ticks: {}, pointsShown: {}, openAnyway: {} };
  try {
    var raw = window.localStorage.getItem(KEY);
    if (raw) { var saved = JSON.parse(raw); Object.keys(state).forEach(function (k) { if (saved[k] !== undefined) state[k] = saved[k]; }); }
  } catch (e) { /* storage unavailable: run without persistence */ }
  function save() { try { window.localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignore */ } }

  var tabsEl = document.getElementById('tabs');
  var viewEl = document.getElementById('view');

  // Every value from the data goes in through textContent, never innerHTML.
  function h(tag, props, children) {
    var el = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) {
      var v = props[k];
      if (v === undefined || v === null || v === false) return;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    });
    (children || []).forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return el;
  }

  function levelNum(id) { return ORDER.indexOf(id); }
  function prevPresent(id) {
    var i = levelNum(id) - 1;
    while (i >= 0 && !byId[ORDER[i]]) i--;
    return i >= 0 ? ORDER[i] : null;
  }
  function nextPresent(id) {
    for (var i = levelNum(id) + 1; i < ORDER.length; i++) if (byId[ORDER[i]]) return ORDER[i];
    return null;
  }
  function isUnlocked(id) {
    var p = prevPresent(id);
    return !p || !!state.passed[p] || !!state.openAnyway[id];
  }
  function meta(id, field) {
    var lv = byId[id] || {};
    return lv[field] || DEFAULTS[id][field];
  }

  // ---------- diagrams (Mermaid, with a readable fallback) ----------
  var mermaidReady = false, seq = 0;
  function initMermaid() {
    if (!window.mermaid) return false;
    if (!mermaidReady) {
      window.mermaid.initialize({
        startOnLoad: false, securityLevel: 'strict',
        theme: window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default'
      });
      mermaidReady = true;
    }
    return true;
  }
  function fallback(source, why) {
    return h('div', { class: 'fallback' }, [h('p', { class: 'hint', text: why }), h('pre', { text: source })]);
  }
  function paint(container, source, guard) {
    if (!initMermaid()) {
      container.textContent = '';
      container.appendChild(fallback(source, 'The diagram library could not load (it needs the network once). Diagram source:'));
      return Promise.resolve();
    }
    var id = 'mmd' + (++seq);
    return window.mermaid.render(id, source).then(function (r) {
      if (guard && !guard()) return;
      container.innerHTML = r.svg;
    }).catch(function () {
      var leftover = document.getElementById('d' + id);
      if (leftover) leftover.remove();
      if (guard && !guard()) return;
      container.textContent = '';
      container.appendChild(fallback(source, 'This diagram failed to render. Diagram source:'));
    });
  }

  function clean(s) { return String(s).replace(/[;#]/g, ',').replace(/[\r\n]+/g, ' '); }
  function buildSequence(steps, n) {
    var alias = new Map();
    for (var i = 0; i < n; i++) {
      [steps[i].from, steps[i].to].forEach(function (name) { if (!alias.has(name)) alias.set(name, 'p' + alias.size); });
    }
    var lines = ['sequenceDiagram'];
    alias.forEach(function (a, name) { lines.push('  participant ' + a + ' as ' + clean(name)); });
    for (var j = 0; j < n; j++) lines.push('  ' + alias.get(steps[j].from) + '->>' + alias.get(steps[j].to) + ': ' + clean(steps[j].text));
    return lines.join('\n');
  }

  function journeyBlock(journey) {
    var steps = journey.steps || [];
    if (!steps.length) return null;
    var n = 1, token = 0;
    var box = h('div', { class: 'diagram' });
    var caption = h('p', { class: 'caption' });
    var counter = h('span', { class: 'counter' });
    var back = h('button', { class: 'btn', text: '◀ Back', onclick: function () { if (n > 1) { n--; draw(); } } });
    var next = h('button', { class: 'btn', text: 'Next ▶', onclick: function () { if (n < steps.length) { n++; draw(); } } });
    function draw() {
      var mine = ++token;
      counter.textContent = n + ' / ' + steps.length;
      caption.textContent = steps[n - 1].text;
      back.disabled = n === 1;
      next.disabled = n === steps.length;
      paint(box, buildSequence(steps, n), function () { return mine === token; });
    }
    draw();
    return h('div', { class: 'journey' }, [
      h('h4', { text: journey.title || 'Step through the journey' }), box, caption,
      h('div', { class: 'controls' }, [back, counter, next])
    ]);
  }

  function staticDiagram(d) {
    var box = h('div', { class: 'diagram' });
    paint(box, d.source);
    return h('div', {}, [d.title ? h('h4', { text: d.title }) : null, box]);
  }

  // ---------- cards ----------
  function evidenceCard(lv) {
    var items = lv.evidence || [];
    if (!items.length && !(lv.unverified || []).length) return null;
    var list = h('ul', { class: 'evidence' }, items.map(function (e) {
      var ok = e.status === 'verified';
      return h('li', {}, [
        h('span', { class: 'badge ' + (ok ? 'verified' : 'unverified'), text: ok ? 'verified' + (e.how ? ' · ' + e.how : '') : 'unverified' }),
        h('span', { text: e.claim }),
        e.where ? h('code', { text: e.where }) : null
      ]);
    }));
    var un = (lv.unverified || []).length
      ? h('div', { class: 'unverified-box' }, [h('b', { text: 'Not confirmed: ' }), (lv.unverified || []).join(' · ')])
      : null;
    return h('section', { class: 'card' }, [h('h3', { text: 'Where this comes from' }), items.length ? list : null, un]);
  }

  function metaphorBlock(m) {
    if (!m || !m.text) return null;
    var rows = (m.mapping || []).map(function (r) { return h('tr', {}, [h('td', { text: r[0] }), h('td', { text: r[1] })]); });
    return h('details', { class: 'metaphor' }, [
      h('summary', { text: 'Metaphor (optional)' }),
      h('p', { text: m.text }),
      rows.length ? h('table', {}, [h('thead', {}, [h('tr', {}, [h('th', { text: 'In the metaphor' }), h('th', { text: 'In this app' })])]), h('tbody', {}, rows)]) : null
    ]);
  }

  function termsCard(id) {
    var rows = (DATA.glossary || []).filter(function (g) { return g.level <= levelNum(id); });
    if (!rows.length) return null;
    return h('section', { class: 'card' }, [
      h('h3', { text: 'Terms so far' }),
      h('table', {}, [
        h('thead', {}, [h('tr', {}, [h('th', { text: 'Plain words' }), h('th', { text: 'Architecture term' }), h('th', { text: 'Name in the code' })])]),
        h('tbody', {}, rows.map(function (g) {
          return h('tr', {}, [h('td', { text: g.plain || '' }), h('td', { text: g.term || '' }), h('td', {}, [g.code ? h('code', { text: g.code }) : ''])]);
        }))
      ])
    ]);
  }

  function checkCard(id, lv) {
    var chk = lv.check || {};
    var points = chk.goodAnswerIncludes || [];
    var ta = h('textarea', { rows: '4', placeholder: 'Say it in your own words, without looking at the answer above…' });
    ta.value = state.explanations[id] || '';
    var ticks = state.ticks[id] || (state.ticks[id] = []);
    var pass = h('button', { class: 'btn primary', text: 'Mark ' + id + ' passed' });
    var need = h('span', { class: 'hint' });
    var passedBox = h('div', { class: 'row' });

    function refresh() {
      var written = ta.value.trim().length > 0;
      var all = points.every(function (_, i) { return !!ticks[i]; });
      var ready = written && (points.length === 0 || all);
      pass.disabled = !ready || !!state.passed[id];
      pass.style.display = state.passed[id] ? 'none' : '';
      need.textContent = state.passed[id] ? '' : (!written ? 'Write your explanation first.' : (!all ? 'Tick each point your explanation covered.' : ''));
      passedBox.textContent = '';
      if (state.passed[id]) {
        var nxt = nextPresent(id);
        passedBox.appendChild(h('span', { class: 'passed-note', text: '✓ ' + id + ' passed' }));
        if (nxt) passedBox.appendChild(h('button', { class: 'btn primary', text: 'Next: ' + nxt + ' ' + meta(nxt, 'title') + ' →', onclick: function () { go(nxt); } }));
        passedBox.appendChild(h('button', { class: 'btn', text: 'Undo', onclick: function () { delete state.passed[id]; save(); renderTabs(); refresh(); } }));
      }
    }
    ta.addEventListener('input', function () { state.explanations[id] = ta.value; save(); refresh(); });
    pass.addEventListener('click', function () { state.passed[id] = true; save(); renderTabs(); refresh(); });

    var pointsBox = h('div', { class: 'checklist' });
    if (points.length) {
      points.forEach(function (p, i) {
        var cb = h('input', { type: 'checkbox' });
        cb.checked = !!ticks[i];
        cb.addEventListener('change', function () { ticks[i] = cb.checked; save(); refresh(); });
        pointsBox.appendChild(h('label', { class: 'tick' }, [cb, h('span', { text: p })]));
      });
    }
    var showBtn = h('button', { class: 'btn', text: state.pointsShown[id] ? 'Hide the checklist' : 'Check my answer' });
    pointsBox.style.display = state.pointsShown[id] ? '' : 'none';
    showBtn.addEventListener('click', function () {
      state.pointsShown[id] = !state.pointsShown[id]; save();
      pointsBox.style.display = state.pointsShown[id] ? '' : 'none';
      showBtn.textContent = state.pointsShown[id] ? 'Hide the checklist' : 'Check my answer';
    });

    var card = h('section', { class: 'card' }, [
      h('h3', { text: 'Check: can you say it without looking?' }),
      h('p', { text: chk.prompt || DEFAULTS[id].check }),
      ta,
      h('div', { class: 'row' }, [showBtn]),
      points.length ? pointsBox : null,
      h('div', { class: 'row' }, [pass, need]),
      passedBox
    ]);
    refresh();
    return card;
  }

  // ---------- views ----------
  function renderView() {
    var id = state.current;
    var lv = byId[id];
    viewEl.textContent = '';
    if (!lv) return;

    viewEl.appendChild(h('h2', {}, [id + ' · ' + meta(id, 'title'), lv.scope ? h('small', { text: lv.scope }) : null]));
    viewEl.appendChild(h('p', { class: 'question', text: meta(id, 'question') }));

    if (!isUnlocked(id)) {
      var p = prevPresent(id);
      viewEl.appendChild(h('div', { class: 'banner' }, [
        h('p', { text: id + ' is locked until you pass the ' + p + ' check. Going down before the level above makes sense is the most common way to get lost.' }),
        h('div', { class: 'row' }, [
          h('button', { class: 'btn primary', text: 'Go to ' + p, onclick: function () { go(p); } }),
          h('button', { class: 'btn', text: 'Open ' + id + ' anyway', onclick: function () { state.openAnyway[id] = true; save(); renderTabs(); renderView(); } })
        ])
      ]));
      return;
    }

    var ta = h('textarea', { rows: '3', placeholder: 'Your best guess. Being wrong is useful: the gap is the lesson.' });
    ta.value = state.predictions[id] || '';
    ta.addEventListener('input', function () { state.predictions[id] = ta.value; save(); });
    var reveal = h('button', { class: 'btn primary', text: state.revealed[id] ? 'Answer shown' : 'Reveal the verified answer', disabled: state.revealed[id] ? 'disabled' : false,
      onclick: function () { state.revealed[id] = true; save(); renderView(); } });
    viewEl.appendChild(h('section', { class: 'card' }, [
      h('h3', { text: 'Predict first' }),
      h('p', { text: (lv.predict && lv.predict.prompt) || DEFAULTS[id].predict }),
      ta,
      h('div', { class: 'row' }, [reveal, h('span', { class: 'hint', text: 'Skipping the guess works, but you learn less.' })])
    ]));
    if (!state.revealed[id]) return;

    var a = lv.answer || {};
    var guess = (state.predictions[id] || '').trim();
    var answer = h('section', { class: 'card' }, [
      h('h3', { text: 'Verified answer' }),
      guess ? h('div', { class: 'compare' }, [
        h('div', {}, [h('b', { text: 'Your prediction' }), guess]),
        h('div', {}, [h('b', { text: 'Verified' }), a.summary || ''])
      ]) : h('p', { class: 'summary', text: a.summary || '' }),
      a.example ? h('div', { class: 'example' }, [h('b', { text: 'Concrete example' }), a.example]) : null,
      (a.points || []).length ? h('ul', { class: 'points' }, a.points.map(function (p) { return h('li', { text: p }); })) : null,
      a.diagram && a.diagram.source ? staticDiagram(a.diagram) : null,
      a.journey ? journeyBlock(a.journey) : null,
      metaphorBlock(lv.metaphor)
    ]);
    viewEl.appendChild(answer);
    var ev = evidenceCard(lv); if (ev) viewEl.appendChild(ev);
    viewEl.appendChild(checkCard(id, lv));
    var terms = termsCard(id); if (terms) viewEl.appendChild(terms);
  }

  function renderTabs() {
    tabsEl.textContent = '';
    ORDER.forEach(function (id) {
      var lv = byId[id];
      var cls = 'tab' + (id === state.current ? ' active' : '') + (lv && state.passed[id] ? ' passed' : '') + (lv && !isUnlocked(id) ? ' locked' : '');
      var label = id + ' ' + (lv ? meta(id, 'title') : DEFAULTS[id].title) + (lv && state.passed[id] ? ' ✓' : '') + (lv && !isUnlocked(id) ? ' 🔒' : '');
      tabsEl.appendChild(h('button', {
        class: cls, text: label, disabled: lv ? false : 'disabled',
        title: lv ? '' : 'Not generated yet. Run the explain skill again with a block or scenario to add it.',
        onclick: function () { go(id); }
      }));
    });
  }

  function go(id) { state.current = id; save(); renderTabs(); renderView(); window.scrollTo(0, 0); }

  function renderHead() {
    document.title = (app.name || 'App') + ' · explained';
    var head = document.getElementById('head');
    var bits = [app.path, app.commit ? 'commit ' + app.commit : null, app.generatedAt ? 'generated ' + app.generatedAt : null].filter(Boolean);
    head.appendChild(h('h1', { text: (app.name || 'App') + ', explained' }));
    head.appendChild(h('p', { class: 'meta', text: bits.join(' · ') }));
    if ((DATA.verification || {}).method) head.appendChild(h('p', { class: 'meta', text: 'How it was checked: ' + DATA.verification.method }));
    if (DATA.scenario) head.appendChild(h('p', { class: 'scenario', text: 'Running example: ' + DATA.scenario }));
  }

  function renderFoot() {
    var foot = document.getElementById('foot');
    foot.appendChild(h('span', { text: 'Your notes and progress stay in this browser only.' }));
    foot.appendChild(h('button', { text: 'Reset my progress', onclick: function () {
      if (!window.confirm('Clear your predictions, explanations and progress on this page?')) return;
      try { window.localStorage.removeItem(KEY); } catch (e) { /* ignore */ }
      window.location.reload();
    } }));
  }

  var first = ORDER.filter(function (id) { return byId[id]; })[0];
  if (!state.current || !byId[state.current]) state.current = first;
  renderHead();
  renderFoot();
  renderTabs();
  renderView();
})();
</script>
</body>
</html>
